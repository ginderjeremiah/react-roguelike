name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# ┌─────────────────────────────────────────────────────────────────────────────────────────────┐
# │ WARNING: the three job `name:` values below are PINNED by the branch ruleset on main.        │
# │                                                                                             │
# │ Required status checks are matched by display name, so renaming a job produces a PR where    │
# │ the required context never reports. GitHub shows "Expected — Waiting for status to be        │
# │ reported" indefinitely, and because the ruleset has no bypass actors, that PR becomes        │
# │ permanently unmergeable — including a PR that would fix it. Recovery means editing the       │
# │ ruleset in repo settings first.                                                             │
# │                                                                                             │
# │ To rename a job: update the ruleset's required contexts FIRST, then rename here.             │
# │                                                                                             │
# │ Equally: do NOT add `paths:`/`paths-ignore:` filters or an `if:` condition to these jobs.    │
# │ A skipped job reports as PASSING to required status checks, so filtering silently opens the  │
# │ merge gate rather than blocking it — the failure direction you will not notice.              │
# └─────────────────────────────────────────────────────────────────────────────────────────────┘

jobs:
  static:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test -- --run

  e2e:
    name: Build & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Build web export
        run: npm run build:web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
